openapi: 3.1.0
info:
  title: Repository Knowledge Compiler Local API
  version: 0.3.0-reference
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: |
    Local API implemented by `rkc serve`. It exposes one exported RKC dataset.
    Every dataset-bound response carries `X-RKC-Snapshot-ID`; clients that
    combine parallel responses must require one identical value and bind it to
    the manifest/coverage identities before presenting the result.
    Nodes, artifacts, edges, diagnostics, and search support opaque cursor
    pagination. These endpoints reject unknown or repeated query parameters,
    malformed query encoding, query/filter values above 4096 UTF-8 bytes, and
    raw query strings above 32768 bytes. Unknown filter values return no matches.
    Cursors bind the endpoint, exact query/filter parameter names and values,
    process, and dataset generation. Preserve omitted versus empty parameters
    and aliases when continuing; page size may change.
    Restart traversal after a server restart or atlas reload invalidates a cursor.
    The optional workbench routes exist only when a user explicitly enables the
    token-authenticated, loopback-only command surface under RKC's resource
    guard. The larger multi-repository service contract is retained in
    `openapi-service-future.yaml` and is not falsely advertised as implemented.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      description: Discover public interfaces, portable CLI argument vectors, output workflows, limits, and evidence boundaries. No private host paths are returned.
      responses:
        '200':
          description: Versioned rkc-capabilities/v1 discovery bound to the selected snapshot.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/context:
    get:
      operationId: getContext
      description: Retrieve deterministic cited excerpts from the selected immutable index without source-file reads, model calls, or writes. max_bytes bounds the compact JSON items array, excluding its small envelope. Text and source metadata remain untrusted repository data.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 4096 }, description: Nonempty UTF-8 search query, at most 4096 bytes. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
        - { name: max_bytes, in: query, schema: { type: integer, minimum: 1024, maximum: 262144, default: 32768 } }
        - { name: format, in: query, schema: { type: string, enum: [json, markdown], default: json } }
      responses:
        '200':
          description: Versioned rkc-context/v1 packet or a Markdown attachment with the same admitted evidence. Empty results are successful and carry an explicit warning.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { $ref: '../schemas/context.schema.json' }
            text/markdown:
              schema: { type: string }
        '400':
          description: Invalid, repeated, unknown, or out-of-bounds parameters.
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Process and dataset health.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/v1/manifest:
    get:
      operationId: getManifest
      responses:
        '200':
          description: Snapshot manifest.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/coverage:
    get:
      operationId: getCoverage
      responses:
        '200':
          description: Auditable coverage report.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/facets:
    get:
      operationId: getFacets
      responses:
        '200':
          description: Bounded node, language, and edge-resolution facet values.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/artifacts:
    get:
      operationId: listArtifacts
      description: Page through canonical inventory records in deterministic order. Unknown filter values produce an empty page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: language, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: status, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: path_prefix, in: query, schema: { type: string, maxLength: 4096 }, description: Include artifacts whose repository-relative path starts with this value. }
      responses:
        '200': { $ref: '#/components/responses/ArtifactPage' }
        '400': { $ref: '#/components/responses/PaginationProblem' }
  /api/v1/artifacts/{artifactID}:
    get:
      operationId: getArtifact
      parameters:
        - { name: artifactID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One artifact.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/nodes:
    get:
      operationId: listNodes
      description: Page through canonical nodes in deterministic inventory order, or lexical rank when q is supplied. Unknown filter values produce an empty page.
      parameters:
        - $ref: '#/components/parameters/NodeLimit'
        - $ref: '#/components/parameters/Cursor'
        - { name: q, in: query, schema: { type: string, maxLength: 4096 }, description: Optional lexical query of at most 4096 UTF-8 bytes. A nonempty query returns matching node records with retrieval metadata. }
        - { name: kind, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: language, in: query, schema: { type: string, maxLength: 4096 } }
      responses:
        '200': { $ref: '#/components/responses/NodePage' }
        '400': { $ref: '#/components/responses/PaginationProblem' }
  /api/v1/nodes/{nodeID}:
    get:
      operationId: getNode
      parameters:
        - { name: nodeID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node plus incoming/outgoing edges and evidence.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/edges:
    get:
      operationId: listEdges
      description: Page through canonical graph relationships in deterministic order. Unknown filter values produce an empty page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: kind, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: from, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: to, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: resolution, in: query, schema: { type: string, maxLength: 4096 } }
      responses:
        '200': { $ref: '#/components/responses/EdgePage' }
        '400': { $ref: '#/components/responses/PaginationProblem' }
  /api/v1/evidence/{evidenceID}:
    get:
      operationId: getEvidence
      parameters:
        - { name: evidenceID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One evidence record.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/diagnostics:
    get:
      operationId: listDiagnostics
      description: Page through canonical analyzer and validation findings in deterministic order. Unknown filter values produce an empty page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: severity, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
      responses:
        '200': { $ref: '#/components/responses/DiagnosticPage' }
        '400': { $ref: '#/components/responses/PaginationProblem' }
  /api/v1/search:
    get:
      operationId: search
      description: Page through ranked lexical results. Keep q and exact filter parameters unchanged across pages. Unknown filter values produce no hits.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 4096 }, description: Nonempty lexical query of at most 4096 UTF-8 bytes. }
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/Cursor'
        - { name: kinds, in: query, schema: { type: string, maxLength: 4096 }, description: Comma-separated indexed-object kinds. }
        - { name: kind, in: query, deprecated: true, schema: { type: string, maxLength: 4096 }, description: Compatibility alias for kinds; ignored when kinds is nonempty. }
        - { name: languages, in: query, schema: { type: string, maxLength: 4096 }, description: Comma-separated languages. }
        - { name: language, in: query, deprecated: true, schema: { type: string, maxLength: 4096 }, description: Compatibility alias for languages; ignored when languages is nonempty. }
        - { name: object_types, in: query, schema: { type: string, maxLength: 4096 }, description: Comma-separated object types. }
        - { name: type, in: query, deprecated: true, schema: { type: string, maxLength: 4096 }, description: Compatibility alias for object_types; ignored when object_types is nonempty. }
        - { name: path_prefix, in: query, schema: { type: string, maxLength: 4096 } }
      responses:
        '200':
          description: Ranked lexical results with retrieval trace fields and snapshot-bound continuation.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400': { $ref: '#/components/responses/PaginationProblem' }
  /api/v1/graph/neighborhood:
    get:
      operationId: neighborhood
      parameters:
        - { name: node_id, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/TraversalDirection'
        - $ref: '#/components/parameters/TraversalEdgeKinds'
        - $ref: '#/components/parameters/TraversalResolutions'
        - $ref: '#/components/parameters/TraversalMaxDepth'
        - $ref: '#/components/parameters/TraversalHops'
        - $ref: '#/components/parameters/TraversalMaxNodes'
        - $ref: '#/components/parameters/TraversalLimit'
        - $ref: '#/components/parameters/TraversalIncludeUnresolved'
      responses:
        '200':
          description: Bounded graph neighbourhood.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/graph/path:
    get:
      operationId: shortestPath
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/TraversalDirection'
        - $ref: '#/components/parameters/TraversalEdgeKinds'
        - $ref: '#/components/parameters/TraversalResolutions'
        - $ref: '#/components/parameters/TraversalMaxDepth'
        - $ref: '#/components/parameters/TraversalHops'
        - $ref: '#/components/parameters/TraversalMaxNodes'
        - $ref: '#/components/parameters/TraversalLimit'
        - $ref: '#/components/parameters/TraversalIncludeUnresolved'
      responses:
        '200':
          description: Shortest bounded path.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/graph/components:
    get:
      operationId: components
      parameters:
        - $ref: '#/components/parameters/ComponentLimit'
        - { name: edge_kinds, in: query, schema: { type: string }, description: Comma-separated edge kinds. }
        - { name: cyclic, in: query, schema: { type: boolean } }
        - { name: cycles_only, in: query, deprecated: true, schema: { type: boolean }, description: Compatibility alias for cyclic; ignored when cyclic is present. }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /api/v1/impact:
    get:
      operationId: impact
      parameters:
        - { name: node_id, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/ImpactDirection'
        - $ref: '#/components/parameters/TraversalEdgeKinds'
        - $ref: '#/components/parameters/TraversalResolutions'
        - $ref: '#/components/parameters/TraversalMaxDepth'
        - $ref: '#/components/parameters/TraversalHops'
        - $ref: '#/components/parameters/TraversalMaxNodes'
        - $ref: '#/components/parameters/TraversalLimit'
        - $ref: '#/components/parameters/TraversalIncludeUnresolved'
      responses:
        '200':
          description: Bounded reverse-impact traversal by default.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/session:
    get:
      operationId: getWorkbenchSession
      description: Available only for an explicitly enabled loopback workbench.
      responses:
        '200':
          description: Ephemeral same-origin token, command catalogue, and bounds.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/directories:
    get:
      operationId: listWorkbenchDirectories
      description: >-
        Lists a bounded set of child directories for the local graphical
        folder picker. Symlink entries are not followed during enumeration.
      parameters:
        - $ref: '#/components/parameters/WorkbenchToken'
        - name: path
          in: query
          description: Absolute path or a path relative to the workbench workspace.
          schema: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: Canonical selected directory, parent, and bounded children.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchDirectoryListing' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/jobs:
    post:
      operationId: createWorkbenchJob
      description: Runs one allow-listed RKC argument vector without a shell.
      parameters:
        - $ref: '#/components/parameters/WorkbenchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [args]
              additionalProperties: false
              properties:
                args:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '202':
          description: Accepted bounded job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/jobs/{jobID}:
    get:
      operationId: getWorkbenchJob
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/WorkbenchToken'
      responses:
        '200':
          description: Current bounded job state and captured output.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: cancelWorkbenchJob
      description: Cancel a queued or running job and release its execution resources.
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/WorkbenchToken'
      responses:
        '200':
          description: Terminal canceled job state, or the existing terminal state for an idempotent repeat.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  headers:
    SnapshotID:
      description: Immutable dataset generation selected once for this response.
      required: true
      schema: { type: string, minLength: 1 }
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 5000, default: 100 }
      description: Page size. For compatibility, missing, malformed, or values below 1 use the default; values above the maximum are clamped. May change between pages.
    NodeLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      description: Page size. For compatibility, missing, malformed, or values below 1 use the default; values above the maximum are clamped. May change between pages.
    SearchLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
      description: Page size. For compatibility, missing, malformed, or values below 1 use the default; values above the maximum are clamped. May change between pages.
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 4096 }
      description: Opaque next_cursor from the preceding page, at most 4096 UTF-8 bytes. Omit or leave empty for the first page. Pass unchanged with the same endpoint and exact query/filter parameters, including their names and presence; limit may change. Bound to the serving process and dataset generation, so a restart or atlas reload invalidates it. Invalid, modified, or mismatched cursors return HTTP 400.
    ComponentLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
    TraversalDirection:
      name: direction
      in: query
      schema: { type: string, enum: [incoming, outgoing, both], default: both }
    ImpactDirection:
      name: direction
      in: query
      schema: { type: string, enum: [incoming, outgoing, both], default: incoming }
    TraversalEdgeKinds:
      name: edge_kinds
      in: query
      schema: { type: string }
      description: Comma-separated edge kinds to traverse.
    TraversalResolutions:
      name: resolutions
      in: query
      schema: { type: string }
      description: Comma-separated edge resolutions to traverse.
    TraversalMaxDepth:
      name: max_depth
      in: query
      schema: { type: integer, minimum: 0, maximum: 64 }
      description: Maximum traversal depth. Takes precedence over hops; endpoint defaults are 1 for neighborhood, 8 for path, and 4 for impact.
    TraversalHops:
      name: hops
      in: query
      schema: { type: integer, minimum: 0, maximum: 64 }
      description: Compatibility depth parameter used when max_depth is absent.
    TraversalMaxNodes:
      name: max_nodes
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000 }
      description: Maximum visited nodes. Takes precedence over limit; endpoint defaults are 500 for neighborhood, 10000 for path, and 5000 for impact.
    TraversalLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000 }
      description: Compatibility node bound used when max_nodes is absent.
    TraversalIncludeUnresolved:
      name: include_unresolved
      in: query
      schema: { type: boolean, default: false }
    WorkbenchToken:
      name: X-RKC-Workbench-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
        snapshot_id: { type: string }
        schema_version: { type: string }
      additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      additionalProperties: true
    ItemPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        truncated: { type: boolean }
        total: { type: integer }
    CollectionPage:
      type: object
      required: [items, total, truncated, snapshot_id]
      properties:
        items: { type: array, items: {} }
        total:
          type: integer
          minimum: 0
          description: Count of all records matching the filters, including records before this page.
        truncated:
          type: boolean
          description: True exactly when matching records remain after this page.
        snapshot_id:
          type: string
          minLength: 1
          description: Immutable dataset identity; must equal the X-RKC-Snapshot-ID response header.
        next_cursor:
          type: string
          minLength: 1
          maxLength: 4096
          description: Opaque continuation token. Present exactly when truncated is true; omitted after the last page. Keep the same endpoint and exact query/filter parameters.
      additionalProperties: true
    NodePage:
      allOf:
        - { $ref: '#/components/schemas/CollectionPage' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '../schemas/rkc-bundle.schema.json#/$defs/node' } }
            retrieval: { type: object, additionalProperties: true, description: Lexical retrieval metadata included when q selects ranked nodes. }
    ArtifactPage:
      allOf:
        - { $ref: '#/components/schemas/CollectionPage' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '../schemas/rkc-bundle.schema.json#/$defs/artifact' } }
    EdgePage:
      allOf:
        - { $ref: '#/components/schemas/CollectionPage' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '../schemas/rkc-bundle.schema.json#/$defs/edge' } }
    DiagnosticPage:
      allOf:
        - { $ref: '#/components/schemas/CollectionPage' }
        - type: object
          properties:
            items: { type: array, items: { $ref: '../schemas/rkc-bundle.schema.json#/$defs/diagnostic' } }
    SearchPage:
      type: object
      required: [query, hits, truncated, mode, index_version, total, snapshot_id]
      properties:
        query: { type: string, description: Original query text echoed by the lexical index. }
        hits: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        truncated: { $ref: '#/components/schemas/CollectionPage/properties/truncated' }
        total: { $ref: '#/components/schemas/CollectionPage/properties/total' }
        snapshot_id: { $ref: '#/components/schemas/CollectionPage/properties/snapshot_id' }
        next_cursor: { $ref: '#/components/schemas/CollectionPage/properties/next_cursor' }
        mode: { type: string, description: Retrieval strategy used for these hits. }
        index_version: { type: string, description: Search-index contract used for ranking. }
      additionalProperties: true
    SearchHit:
      type: object
      required: [document, score, reasons, terms]
      properties:
        document: { $ref: '#/components/schemas/SearchDocument' }
        score: { type: number }
        reasons: { type: array, items: { type: string } }
        terms: { type: array, items: { type: string } }
      additionalProperties: true
    SearchDocument:
      type: object
      required: [id, object_type, title]
      properties:
        id: { type: string, description: Stable identifier of the indexed object. }
        object_type: { type: string, description: Projection class such as node or artifact or document. }
        title: { type: string }
        kind: { type: string }
        language: { type: string }
        qualified_name: { type: string }
        signature: { type: string }
        path: { type: string, description: Repository-relative source path when available. }
        body: { type: string, description: Bounded text projection; repository content remains untrusted data. }
        metadata: { type: object, additionalProperties: { type: string } }
      additionalProperties: true
    WorkbenchJob:
      type: object
      required: [id, args, status, created_at, deadline_at, output, truncated]
      properties:
        id: { type: string }
        args: { type: array, items: { type: string } }
        status: { type: string, enum: [queued, running, succeeded, failed, timed_out, canceled, cleanup_failed] }
        created_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        exit_code: { type: integer }
        output: { type: string }
        truncated: { type: boolean }
        error: { type: string }
        cleanup_scope: { type: string, enum: [process_group, direct_process] }
      additionalProperties: true
    WorkbenchDirectoryEntry:
      type: object
      required: [name, path]
      additionalProperties: false
      properties:
        name: { type: string }
        path: { type: string }
    WorkbenchDirectoryListing:
      type: object
      required: [path, directories, truncated]
      additionalProperties: false
      properties:
        path: { type: string }
        parent: { type: string }
        directories:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/WorkbenchDirectoryEntry' }
        truncated: { type: boolean }
  responses:
    ItemPage:
      description: A bounded result page.
      headers:
        X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemPage' }
    NodePage:
      description: One snapshot-bound page of canonical nodes, with a cursor when further matches remain.
      headers:
