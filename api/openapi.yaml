openapi: 3.1.0
info:
  title: Repository Knowledge Compiler Local API
  version: 0.3.0-reference
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: |
    Local API implemented by `rkc serve`. It exposes one exported RKC dataset.
    Every dataset-bound response carries `X-RKC-Snapshot-ID`; clients that
    combine parallel responses must require one identical value and bind it to
    the manifest/coverage identities before presenting the result.
    The optional workbench routes exist only when a user explicitly enables the
    token-authenticated, loopback-only command surface under RKC's resource
    guard. The larger multi-repository service contract is retained in
    `openapi-service-future.yaml` and is not falsely advertised as implemented.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Process and dataset health.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/v1/manifest:
    get:
      operationId: getManifest
      responses:
        '200':
          description: Snapshot manifest.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/coverage:
    get:
      operationId: getCoverage
      responses:
        '200':
          description: Auditable coverage report.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/facets:
    get:
      operationId: getFacets
      responses:
        '200':
          description: Bounded node, language, and edge-resolution facet values.
          headers:
            X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - { name: language, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: path_prefix, in: query, schema: { type: string }, description: Include artifacts whose repository-relative path starts with this value. }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /api/v1/artifacts/{artifactID}:
    get:
      operationId: getArtifact
      parameters:
        - { name: artifactID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One artifact.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/nodes:
    get:
      operationId: listNodes
      parameters:
        - $ref: '#/components/parameters/NodeLimit'
        - { name: q, in: query, schema: { type: string, minLength: 1 }, description: Optional lexical query. When present, returns matching node records with retrieval metadata. }
        - { name: kind, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /api/v1/nodes/{nodeID}:
    get:
      operationId: getNode
      parameters:
        - { name: nodeID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node plus incoming/outgoing edges and evidence.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/edges:
    get:
      operationId: listEdges
      parameters:
        - $ref: '#/components/parameters/Limit'
        - { name: kind, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: resolution, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /api/v1/evidence/{evidenceID}:
    get:
      operationId: getEvidence
      parameters:
        - { name: evidenceID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One evidence record.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/diagnostics:
    get:
      operationId: listDiagnostics
      parameters:
        - $ref: '#/components/parameters/Limit'
        - { name: severity, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /api/v1/search:
    get:
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - $ref: '#/components/parameters/SearchLimit'
        - { name: kinds, in: query, schema: { type: string }, description: Comma-separated node kinds. }
        - { name: kind, in: query, deprecated: true, schema: { type: string }, description: Compatibility alias for kinds; ignored when kinds is present. }
        - { name: languages, in: query, schema: { type: string }, description: Comma-separated languages. }
        - { name: language, in: query, deprecated: true, schema: { type: string }, description: Compatibility alias for languages; ignored when languages is present. }
        - { name: object_types, in: query, schema: { type: string }, description: Comma-separated object types. }
        - { name: type, in: query, deprecated: true, schema: { type: string }, description: Compatibility alias for object_types; ignored when object_types is present. }
        - { name: path_prefix, in: query, schema: { type: string } }
      responses:
        '200':
          description: Ranked lexical results with retrieval trace fields.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/graph/neighborhood:
    get:
      operationId: neighborhood
      parameters:
        - { name: node_id, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/TraversalDirection'
        - $ref: '#/components/parameters/TraversalEdgeKinds'
        - $ref: '#/components/parameters/TraversalResolutions'
        - $ref: '#/components/parameters/TraversalMaxDepth'
        - $ref: '#/components/parameters/TraversalHops'
        - $ref: '#/components/parameters/TraversalMaxNodes'
        - $ref: '#/components/parameters/TraversalLimit'
        - $ref: '#/components/parameters/TraversalIncludeUnresolved'
      responses:
        '200':
          description: Bounded graph neighbourhood.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/graph/path:
    get:
      operationId: shortestPath
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/TraversalDirection'
        - $ref: '#/components/parameters/TraversalEdgeKinds'
        - $ref: '#/components/parameters/TraversalResolutions'
        - $ref: '#/components/parameters/TraversalMaxDepth'
        - $ref: '#/components/parameters/TraversalHops'
        - $ref: '#/components/parameters/TraversalMaxNodes'
        - $ref: '#/components/parameters/TraversalLimit'
        - $ref: '#/components/parameters/TraversalIncludeUnresolved'
      responses:
        '200':
          description: Shortest bounded path.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/graph/components:
    get:
      operationId: components
      parameters:
        - $ref: '#/components/parameters/ComponentLimit'
        - { name: edge_kinds, in: query, schema: { type: string }, description: Comma-separated edge kinds. }
        - { name: cyclic, in: query, schema: { type: boolean } }
        - { name: cycles_only, in: query, deprecated: true, schema: { type: boolean }, description: Compatibility alias for cyclic; ignored when cyclic is present. }
      responses:
        '200': { $ref: '#/components/responses/ItemPage' }
  /api/v1/impact:
    get:
      operationId: impact
      parameters:
        - { name: node_id, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/ImpactDirection'
        - $ref: '#/components/parameters/TraversalEdgeKinds'
        - $ref: '#/components/parameters/TraversalResolutions'
        - $ref: '#/components/parameters/TraversalMaxDepth'
        - $ref: '#/components/parameters/TraversalHops'
        - $ref: '#/components/parameters/TraversalMaxNodes'
        - $ref: '#/components/parameters/TraversalLimit'
        - $ref: '#/components/parameters/TraversalIncludeUnresolved'
      responses:
        '200':
          description: Bounded reverse-impact traversal by default.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/session:
    get:
      operationId: getWorkbenchSession
      description: Available only for an explicitly enabled loopback workbench.
      responses:
        '200':
          description: Ephemeral same-origin token, command catalogue, and bounds.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/directories:
    get:
      operationId: listWorkbenchDirectories
      description: >-
        Lists a bounded set of child directories for the local graphical
        folder picker. Symlink entries are not followed during enumeration.
      parameters:
        - $ref: '#/components/parameters/WorkbenchToken'
        - name: path
          in: query
          description: Absolute path or a path relative to the workbench workspace.
          schema: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: Canonical selected directory, parent, and bounded children.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchDirectoryListing' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/jobs:
    post:
      operationId: createWorkbenchJob
      description: Runs one allow-listed RKC argument vector without a shell.
      parameters:
        - $ref: '#/components/parameters/WorkbenchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [args]
              additionalProperties: false
              properties:
                args:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '202':
          description: Accepted bounded job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/workbench/jobs/{jobID}:
    get:
      operationId: getWorkbenchJob
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/WorkbenchToken'
      responses:
        '200':
          description: Current bounded job state and captured output.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: cancelWorkbenchJob
      description: Cancel a queued or running job and release its execution resources.
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/WorkbenchToken'
      responses:
        '200':
          description: Terminal canceled job state, or the existing terminal state for an idempotent repeat.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  headers:
    SnapshotID:
      description: Immutable dataset generation selected once for this response.
      required: true
      schema: { type: string, minLength: 1 }
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 5000, default: 100 }
    NodeLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    SearchLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    ComponentLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
    TraversalDirection:
      name: direction
      in: query
      schema: { type: string, enum: [incoming, outgoing, both], default: both }
    ImpactDirection:
      name: direction
      in: query
      schema: { type: string, enum: [incoming, outgoing, both], default: incoming }
    TraversalEdgeKinds:
      name: edge_kinds
      in: query
      schema: { type: string }
      description: Comma-separated edge kinds to traverse.
    TraversalResolutions:
      name: resolutions
      in: query
      schema: { type: string }
      description: Comma-separated edge resolutions to traverse.
    TraversalMaxDepth:
      name: max_depth
      in: query
      schema: { type: integer, minimum: 0, maximum: 64 }
      description: Maximum traversal depth. Takes precedence over hops; endpoint defaults are 1 for neighborhood, 8 for path, and 4 for impact.
    TraversalHops:
      name: hops
      in: query
      schema: { type: integer, minimum: 0, maximum: 64 }
      description: Compatibility depth parameter used when max_depth is absent.
    TraversalMaxNodes:
      name: max_nodes
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000 }
      description: Maximum visited nodes. Takes precedence over limit; endpoint defaults are 500 for neighborhood, 10000 for path, and 5000 for impact.
    TraversalLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000 }
      description: Compatibility node bound used when max_nodes is absent.
    TraversalIncludeUnresolved:
      name: include_unresolved
      in: query
      schema: { type: boolean, default: false }
    WorkbenchToken:
      name: X-RKC-Workbench-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
        snapshot_id: { type: string }
        schema_version: { type: string }
      additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      additionalProperties: true
    ItemPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        truncated: { type: boolean }
        total: { type: integer }
    WorkbenchJob:
      type: object
      required: [id, args, status, created_at, deadline_at, output, truncated]
      properties:
        id: { type: string }
        args: { type: array, items: { type: string } }
        status: { type: string, enum: [queued, running, succeeded, failed, timed_out, canceled, cleanup_failed] }
        created_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        exit_code: { type: integer }
        output: { type: string }
        truncated: { type: boolean }
        error: { type: string }
        cleanup_scope: { type: string, enum: [process_group, direct_process] }
      additionalProperties: true
    WorkbenchDirectoryEntry:
      type: object
      required: [name, path]
      additionalProperties: false
      properties:
        name: { type: string }
        path: { type: string }
    WorkbenchDirectoryListing:
      type: object
      required: [path, directories, truncated]
      additionalProperties: false
      properties:
        path: { type: string }
        parent: { type: string }
        directories:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/WorkbenchDirectoryEntry' }
        truncated: { type: boolean }
  responses:
    ItemPage:
      description: A bounded result page.
      headers:
        X-RKC-Snapshot-ID: { $ref: '#/components/headers/SnapshotID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemPage' }
    Problem:
      description: RFC 7807-style problem response.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
