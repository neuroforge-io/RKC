name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify contribution sign-off
        env:
          RKC_DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/validate-dco.sh "$RKC_DCO_BASE" HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline-contract validators
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Provision fail-closed user-systemd runtime
        shell: bash
        run: |
          set -euo pipefail
          user_id="$(id -u)"
          user_name="$(id -un)"
          runtime_dir="/run/user/${user_id}"
          drop_in='/etc/systemd/system/user@.service.d/90-rkc-ci-delegation.conf'
          sudo install -d -m 0755 "$(dirname "$drop_in")"
          printf '%s\n' '[Service]' 'Delegate=cpu io memory pids' |
            sudo tee "$drop_in" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$user_name"
          sudo systemctl restart "user@${user_id}.service"
          test -S "${runtime_dir}/bus"
          {
            printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir"
            printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir"
          } >> "$GITHUB_ENV"
      - name: Verify delegated resource guard
        env:
          RKC_RESOURCE_GUARD_MODE: service
          RKC_REQUIRE_IO_CONTROLLER: '1'
        run: sh scripts/verify-resource-guard.sh
      - name: Verify downloaded Go modules
        env:
          RKC_RESOURCE_GUARD_MODE: service
        run: sh scripts/with-rkc-limits.sh make go-mod-verify
      - name: Verify CGO-free Go test and build paths
        env:
          CGO_ENABLED: '0'
          RKC_RESOURCE_GUARD_MODE: service
        run: |
          sh scripts/with-rkc-limits.sh go test -p=1 ./...
          sh scripts/with-rkc-limits.sh make build
      - name: Verify portable Go target builds
        env:
          RKC_RESOURCE_GUARD_MODE: service
        run: sh scripts/with-rkc-limits.sh make portable-build
      - name: Run full release verification and assemble the complete package
        env:
          # Release binaries remain explicitly CGO-free; the release proof also
          # runs Go's race detector, which requires CGO on the Linux runner.
          CGO_ENABLED: '1'
          RKC_RESOURCE_GUARD_MODE: service
        run: make safe-complete-package
      - name: Build verified non-recursive RKC self-catalogue
        env:
          RKC_RESOURCE_GUARD_MODE: service
        run: make self-catalogue
      - name: Build profiled quality gap index
        env:
          RKC_RESOURCE_GUARD_MODE: service
          RKC_QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          profile_root=.rkc-quality-coverage
          sh scripts/with-rkc-limits.sh python3 scripts/coverage_gate.py \
            --output-dir "$profile_root"
          go_profile=$(find "$profile_root" -type f -name go.merged.out -print -quit)
          go_report=$(find "$profile_root" -type f -name summary.json -print -quit)
          python_report=$(find "$profile_root" -type f -name python.json -print -quit)
          test -n "$go_profile" && test -f "$go_profile"
          test -n "$go_report" && test -f "$go_report"
          test -n "$python_report" && test -f "$python_report"
          if test -f examples/sample-go/go.mod; then
            example_profile="$profile_root/example-go.out"
            repo_root="$PWD"
            (
              cd examples/sample-go
              sh "$repo_root/scripts/with-rkc-limits.sh" go test \
                -p=1 -count=1 -covermode=atomic \
                -coverprofile="$repo_root/$example_profile" ./...
            )
            combined_profile="$profile_root/go.merged.with-examples.out"
            python3 - "$go_profile" "$example_profile" "$combined_profile" <<'PY'
          import pathlib
          import sys

          root_profile, example_profile, combined_profile = map(pathlib.Path, sys.argv[1:])
          rows = [line for line in root_profile.read_text(encoding="utf-8").splitlines() if line]
          if not rows or not rows[0].startswith("mode: "):
              raise SystemExit("profile merge: root Go profile has no mode header")
          for line in example_profile.read_text(encoding="utf-8").splitlines()[1:]:
              if not line:
                  continue
              name, separator, remainder = line.partition(":")
              if not separator or not name.startswith("example.com/sample-go/"):
                  raise SystemExit(f"profile merge: unexpected nested-module row: {line}")
              name = "examples/sample-go/" + name.removeprefix("example.com/sample-go/")
              rows.append(name + ":" + remainder)
          combined_profile.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
            go_profile="$combined_profile"
          fi
          quality_base=${RKC_QUALITY_BASE-}
          case "$quality_base" in
            '')
              echo 'quality index: event did not provide a comparison base' >&2
              exit 1
              ;;
            *[!0]*)
              ;;
            *)
              # A branch-creation/root push carries an all-zero `before` SHA.
              # Compare its complete committed tree with a real empty-tree
              # object instead of silently falling back to the clean worktree.
              quality_base=$(git mktree </dev/null)
              ;;
          esac
          if ! git rev-parse --verify "${quality_base}^{tree}" >/dev/null 2>&1; then
            echo "quality index: comparison base is unavailable: $quality_base" >&2
            exit 1
          fi
          sh scripts/with-rkc-limits.sh python3 scripts/quality_index.py \
            --root . \
            --output .rkc-quality \
            --base "$quality_base" \
            --go-profile "$go_profile" \
            --go-report "$go_report" \
            --python-report "$python_report"
      - name: Upload quality gap index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rkc-quality-index-${{ github.sha }}
          path: .rkc-quality
          if-no-files-found: error
          include-hidden-files: true
      - name: Docker build
        run: docker build -t rkc:ci .
      - name: Docker runtime smoke (explicit portable no-Python profile)
        shell: bash
        run: |
          set -euo pipefail
          volume="rkc-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_volume="${volume}-state"
          resource_limits=(
            --cpus 1
            --cpu-shares 2
            --memory 2560m
            --memory-reservation 2048m
            --memory-swap 2816m
            --pids-limit 128
            --oom-score-adj 750
            --blkio-weight 10
          )
          docker volume create "$volume" >/dev/null
          docker volume create "$state_volume" >/dev/null
          trap 'docker volume rm -f "$volume" "$state_volume" >/dev/null' EXIT
          docker run --rm "${resource_limits[@]}" \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -v "$GITHUB_WORKSPACE/examples:/workspace:ro" \
            -v "$volume:/output" \
            -v "$state_volume:/state" \
            rkc:ci scan \
              --runs-dir /state/runs \
              --no-python \
              --no-cache \
              --out /output/atlas \
              --force \
              /workspace
          docker run --rm "${resource_limits[@]}" \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -v "$volume:/output:ro" \
            rkc:ci check \
              --coverage /output/atlas/coverage.json \
              --bundle /output/atlas/bundle.json \
              --min-inventory-accounting 1 \
              --min-symbol-evidence 1 \
              --max-errors 0
      - name: Upload demonstration atlas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rkc-demo
          path: |
            dist/release/demo
            dist/release/demo-*.txt
          if-no-files-found: error
      - name: Upload one atomic complete release generation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rkc-complete-release-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
      - name: Upload verified self-catalogue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rkc-self-catalogue-${{ github.sha }}
          path: dist/self-catalogue
          if-no-files-found: error
          include-hidden-files: true
